<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Bonzai Agent</title>
    <script>
      // Pre-paint theme bootstrap. Keep in sync with src/lib/theme.ts; the
      // storage key is duplicated here so the attribute is set before the
      // module bundle runs, avoiding a light-mode flash on dark systems.
      (function () {
        var storedTheme = null;
        try {
          storedTheme =
            localStorage.getItem("os-clovy:theme") ||
            localStorage.getItem("os-june:theme");
        } catch (e) {}
        var prefersDark = false;
        try {
          prefersDark = window.matchMedia("(prefers-color-scheme: dark)").matches;
        } catch (e) {}
        var resolvedTheme =
          storedTheme === "light" || storedTheme === "dark"
            ? storedTheme
            : prefersDark
              ? "dark"
              : "light";
        document.documentElement.setAttribute("data-theme", resolvedTheme);

        // Pin both bridge keys to Bonzai so rollback-readable prefs cannot
        // restore an old Clovy/June color choice. Storage failure must not
        // prevent the independent theme or text-size bootstrap below.
        try {
          localStorage.setItem("os-clovy:brand", "bonzai");
        } catch (e) {}
        try {
          localStorage.setItem("os-june:brand", "bonzai");
        } catch (e) {}

        // Pre-paint text-size multiplier. Keep the id->multiplier map in sync
        // with src/lib/font-scale.ts so a non-default size doesn't flash the
        // base scale before the bundle runs.
        var scale = null;
        try {
          scale =
            localStorage.getItem("os-clovy:font-scale") ||
            localStorage.getItem("os-june:font-scale");
        } catch (e) {}
        var scales = { default: 1, large: 1.1, larger: 1.2 };
        document.documentElement.style.setProperty(
          "--font-scale",
          String(scales[scale] || 1),
        );
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
